name: Deploy bySide to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Finish an in-flight deployment before starting another one. Newer pending runs
# replace older pending runs; the SHA check below also rejects stale reruns.
concurrency:
  group: cloudflare-pages-byside-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: yatuan-companion

    steps:
      - name: Check out the requested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: npm run check

      - name: Test the Cloudflare API and hosted discovery
        run: node --test tests/cloudflare*.test.mjs

      - name: Confirm this is still the latest main commit
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$latest_main_sha" != "$GITHUB_SHA" ]]; then
            echo "Skipping an obsolete commit; a newer main commit owns the next deployment."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy static assets and Pages Functions
        if: steps.latest.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || 'e6ebca3973fc52dc5a1c00e82d70961f' }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Configure the repository secret CLOUDFLARE_API_TOKEN before deploying."
            exit 1
          fi
          npx --yes wrangler@4.118.0 pages deploy dist \
            --project-name byside \
            --branch main \
            --commit-hash "$GITHUB_SHA"
