<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000000"><title>芽团 · 桌面投影</title><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="game-ar.css"><style>
.projection-bg-video{position:fixed;inset:0;width:100vw;height:100vh;object-fit:cover;z-index:0;pointer-events:none;}
.projection-body:not(.ar-active) .projection-bg-video{display:none;}
.projection-body #projection-root{z-index:2;}
.projection-tools{z-index:3;opacity:1;}
.projection-bubble{display:block;max-height:135px;overflow-y:auto;scrollbar-width:thin;}
.ar-video{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#111;z-index:0;pointer-events:none;}
.ar-active .projection-bg-video{display:none;}
#ar-canvas{position:fixed;inset:0;z-index:4;pointer-events:none;touch-action:none;}
.ar-active #projection-root{touch-action:none;cursor:grab;}
.ar-original-effects{display:none;position:absolute;inset:0;width:510px;height:300px;pointer-events:none;}
.ar-active .ar-original-effects{display:block;}
.black-projection-effects{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;}
.ar-active .black-projection-effects{display:none;}
.projection-body .projection-character{width:105px;height:92px;top:48px;left:104px;}
.projection-body .projection-character .human-character{width:65px;height:100px;margin-left:15px;transform:translateY(-10px);}
.projection-body .projection-bubble{max-height:90px;left:220px;top:48px;min-width:85px;max-width:160px;padding:8px 10px;font-size:9px;line-height:1.5;border-radius:10px 10px 10px 2px;}
.projection-body .projection-rug{left:104px;top:123px;width:112px;height:23px;background:radial-gradient(ellipse,#56622e88 0,transparent 68%);}
.projection-body .projection-stats{left:50%;top:207px;width:280px;transform:translateX(-50%);gap:12px;padding:9px 12px;background:#fffdf0f5;border:1px solid #d3dabc;border-radius:12px;box-shadow:0 3px 12px #37472818;z-index:3;}
.projection-body .mini-stat{color:#637048;font-size:9px;}
.projection-body .mini-stat.pink{color:#9b6978;}
.projection-body .mini-stat.amber{color:#9d7b2b;}
.projection-body .mini-stat i{background:#d4dcc6;}
.ar-panel{position:fixed;z-index:10;left:16px;top:16px;width:min(410px,calc(100vw - 32px));border-radius:18px;padding:16px;color:#e9f3dc;background:#233127e8;box-shadow:0 12px 45px #0008;font:13px/1.5 -apple-system,BlinkMacSystemFont,sans-serif;}
.ar-panel[hidden],.ar-video[hidden]{display:none;}
.ar-panel:has(details:not([open])){width:min(270px,calc(100vw - 32px));}
.ar-panel summary{display:flex;align-items:center;justify-content:space-between;gap:12px;color:#fff;font-size:16px;font-weight:700;cursor:pointer;list-style:none;}
.ar-panel summary::-webkit-details-marker{display:none;}
.ar-panel summary:focus-visible{outline:2px solid #d9f09f;outline-offset:4px;border-radius:4px;}
.ar-panel .ar-toggle{color:#d5e2c7;font-size:12px;font-weight:500;white-space:nowrap;}
.ar-panel details[open] .ar-expand,.ar-panel details:not([open]) .ar-collapse{display:none;}
.ar-panel p{margin:8px 0;color:#d5e2c7;}
.ar-panel select,.ar-panel button{font:inherit;color:#293a29;background:#f6f9ed;border:0;border-radius:8px;padding:8px;margin:3px 3px 3px 0;}
.ar-panel select{max-width:225px;}.ar-panel button:disabled{opacity:.5;}.ar-panel input{vertical-align:middle;max-width:150px;}
.ar-active .projection-tools{opacity:1;}
.ar-voice-control{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-top:8px;border-top:1px solid #d5e2c740;}
.ar-voice-control button{font-weight:600;white-space:nowrap;}
.ar-voice-control button[aria-pressed="true"]{background:#c5dca8;color:#20341c;}
.ar-voice-control button:focus-visible{outline:2px solid #d9f09f;outline-offset:2px;}
.ar-voice-control span{flex:1;min-width:100px;color:#d5e2c7;font-size:12px;overflow-wrap:anywhere;}
.projection-body:not(.ar-active) .ar-panel{left:auto;right:16px;width:auto;max-width:calc(100vw - 32px);padding:6px 10px;background:#171c16;}
.projection-body:not(.ar-active) .ar-panel details,.projection-body:not(.ar-active) #ar-status,.ar-voice-control span:empty{display:none;}
.projection-body:not(.ar-active) .ar-voice-control{padding-top:0;border-top:0;}
.ar-active .black-camera-controls{display:none;}
.black-camera-controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.marker-calibration{position:fixed;z-index:30;width:26px;height:26px;border-radius:50%;background:white;transform:translate(-50%,-50%);pointer-events:none;}

</style></head><body class="projection-body"><video class="projection-bg-video" src="./开场视频.mp4" autoplay muted loop playsinline></video><video id="projection-camera" class="ar-video" autoplay muted playsinline hidden></video><canvas id="ar-canvas" aria-label="选择桌面投影区域"></canvas><section id="ar-panel" class="ar-panel" hidden aria-label="桌面 AR 预览控制"><details id="ar-panel-details" open><summary><span>✳ 桌面 AR 预览</span><span class="ar-toggle"><span class="ar-collapse">收起 ▴</span><span class="ar-expand">展开 ▾</span></span></summary><p>桌面追踪在本机处理；开启桌面观察后会发送采样画面。</p><div><select id="ar-device" aria-label="选择摄像头"><option value="">选择摄像头</option></select><button id="ar-refresh">刷新</button><button id="ar-authorize">授权识别设备</button><button id="ar-start">连接摄像头</button></div><div><button id="ar-paper" disabled>自动识别白纸</button><button id="ar-calibrate" disabled>手动圈定</button><button id="ar-stop">关闭摄像头</button><button id="ar-close">退出 AR</button></div><div><label>角色大小 <input id="ar-scale" type="range" min="0.2" max="1" step="0.02" value="0.6"></label> <button id="ar-reset">重置位置</button></div><p>自动识别整张白纸；手动圈定按左上、右上、右下、左下选择完整投影边界。保持纸张和桌面固定，遮挡或快速移动可能丢失追踪。</p></details><p id="ar-status" role="status">选择摄像头后连接。</p><div class="ar-voice-control"><button id="projection-voice" type="button" aria-pressed="false">开始实时语音</button><span id="projection-voice-status" role="status" aria-live="polite"></span></div></section><main id="projection-root" aria-label="桌面陪伴投影视图"></main><div class="projection-tools"><span>同一浏览器内实时联动</span><button id="projection-ar" aria-pressed="true">AR 预览</button><button id="projection-black" aria-pressed="false">黑背景投影</button><button id="projection-live">开始桌边陪伴</button><button id="projection-companion" type="button" hidden>返回陪伴</button><button id="projection-fullscreen">进入全屏</button><a href="help.html" target="_blank" rel="noopener">接线说明</a><a href="./">回到小屋</a></div><script type="module" src="projection.js"></script></body></html>
